name: Deploy

# GeoHarness (https://github.com/Avarok-Cybersecurity/geoharness) builds the site, writes markdown twins,
# llms.txt, the sitemap and robots.txt Content Signals, gates on the GEO score and on 100 in all four
# Lighthouse categories (served locally by wrangler with the deploy's own config), deploys an assets-only
# Cloudflare Worker on thomaspbraun.com and www.thomaspbraun.com, configures the zone, and verifies the live
# site, rolling back if the live checks fail. Pull requests run the same pipeline with deploy: false — no
# secrets, no Cloudflare API call, no zone change. Settings live in geoharness.toml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build, gate, deploy, verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Never cancel a deploy half way: runs for main queue behind each other.
    concurrency:
      group: deploy-thomaspbraun.com
      cancel-in-progress: false
    environment:
      name: production
      url: https://thomaspbraun.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: README.md is generated from content/
        run: npm run check:readme
      - name: GeoHarness (deploy)
        id: geoharness
        uses: Avarok-Cybersecurity/geoharness@d731c52513049f1042758af963dd1d16a9eea0b3 # main
        with:
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          site-path: .
          adapter: npm
          output-dir: dist
          target: workers
          project-name: thomaspbraun
          domains: |
            thomaspbraun.com
            www.thomaspbraun.com
          lighthouse: "true"
          lighthouse-max-urls: "5"
          geo-min-score: "90"
          extra-optimizations: all
          deploy: "true"
          # A build that fails the live GEO audit or the production Lighthouse gate is replaced by the previous one.
          rollback-on-failure: "true"
      - name: Result
        env:
          GEO_SCORE: ${{ steps.geoharness.outputs.geo-score }}
          URL: ${{ steps.geoharness.outputs.url }}
        run: echo "GEO score $GEO_SCORE at $URL"

  dry-run:
    name: Build and gate (dry run)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: deploy-dry-run-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: README.md is generated from content/
        run: npm run check:readme
      - name: GeoHarness (dry run, deploy false)
        id: geoharness
        uses: Avarok-Cybersecurity/geoharness@d731c52513049f1042758af963dd1d16a9eea0b3 # main
        with:
          site-path: .
          adapter: npm
          output-dir: dist
          target: workers
          project-name: thomaspbraun
          domains: |
            thomaspbraun.com
            www.thomaspbraun.com
          lighthouse: "true"
          lighthouse-max-urls: "5"
          geo-min-score: "90"
          extra-optimizations: all
          deploy: "false"
      - name: Result
        env:
          GEO_SCORE: ${{ steps.geoharness.outputs.geo-score }}
        run: echo "GEO score (build) $GEO_SCORE"
